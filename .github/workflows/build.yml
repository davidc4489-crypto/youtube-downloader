name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Prepare bundled ffmpeg
        shell: pwsh
        run: |
          $src = python -c "import imageio_ffmpeg, sys; sys.stdout.write(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $src ffmpeg.exe
          .\ffmpeg.exe -version | Select-Object -First 1

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --clean --name YoutubeDownloader `
            --add-binary "ffmpeg.exe;." `
            youtube_downloader.py

      - name: Smoke test (imports)
        run: python -c "import yt_dlp, youtube_downloader; print('ok', yt_dlp.version.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: YoutubeDownloader-windows
          path: dist/YoutubeDownloader.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YoutubeDownloader.exe
          generate_release_notes: true
